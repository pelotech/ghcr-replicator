# -- Replicator config, rendered verbatim to config.yaml. See config.example.yaml
# in the repo for every field. destination.registry and at least one rule are
# required.
config:
  source:
    registry: ghcr.io
    apiURL: https://api.github.com
  destination:
    # Harbor host only, e.g. harbor.example.com (no https://)
    registry: ""
  concurrency: 4
  rules: []
  # - name: team-apps
  #   filters:
  #     name: "my-org/apps/**"
  #     tag: "{,v}[0-9]*.[0-9]*.[0-9]*"
  #   destNamespace: apps
  #   destNamespaceReplace: 2

credentials:
  # -- Required. The name of an existing Secret in the release namespace with
  # the keys GHCR_USERNAME, GHCR_TOKEN, HARBOR_USERNAME and HARBOR_PASSWORD.
  # Create it outside the chart, for example with SOPS or External Secrets.
  secretName: ""

nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/pelotech/ghcr-replicator
  # -- Defaults to the chart appVersion.
  tag: ""
  # -- Overrides tag when set, e.g. sha256:...
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

schedule: "0 3 * * *"
timeZone: Etc/UTC
suspend: false
concurrencyPolicy: Forbid
startingDeadlineSeconds: 600
successfulJobsHistoryLimit: 3
failedJobsHistoryLimit: 3
backoffLimit: 1
ttlSecondsAfterFinished: 604800

# -- Passed as -timeout. Keep activeDeadlineSeconds (seconds) above it.
timeout: 55m
activeDeadlineSeconds: 3600
dryRun: false
logLevel: info
extraArgs: []
extraEnv: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi

nodeSelector: {}
tolerations: []
affinity: {}
