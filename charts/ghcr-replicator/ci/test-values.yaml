# Values used by CI lint/template, and by the Go test that checks this config
# parses with the replicator's own validation.
config:
  destination:
    registry: harbor.example.com
  rules:
    - name: team-apps
      filters:
        name: "my-org/apps/**"
        tag: "{,v}[0-9]*.[0-9]*.[0-9]*"
      destNamespace: apps
      destNamespaceReplace: 2
    - name: charts
      override: false
      filters:
        name: "my-org/charts/**"
        tag: "*-rc*"
        tagDecoration: excludes
      destNamespace: platform/charts
      destNamespaceReplace: 2
credentials:
  secretName: ghcr-replicator-credentials
dryRun: true
